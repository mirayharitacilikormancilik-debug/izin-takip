<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>İzin Takip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5E5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İzin Takip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Defterdar ile aynı aile — tek sütunlu cep uygulaması; üstte dosya fişi özeti, altında dosya kartları; dosya, firma, eşitleme ayrı ekranlar; formlar alttan açılan sayfalar */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#13221B; --muted:#5E6E66; --line:#DCE4DE;
  --accent:#0E5E5A; --accent-ink:#FFFFFF; --soft:#E3EFEC;
  --ok:#1C7A47; --ok-soft:#E3F2E8; --bad:#B8402C; --bad-soft:#F8E6E1; --warn:#B5770F; --warn-soft:#FBF0DA; --idle:#6B7280; --idle-soft:#ECEEF0;
  --scrim:rgba(10,20,16,.55);
  --f-display:"Bricolage Grotesque","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211C; --ink:#E6EEE9; --muted:#93A59C; --line:#26352E;
  --accent:#4DB8A9; --accent-ink:#06201C; --soft:#173430;
  --ok:#5CC98A; --ok-soft:#173726; --bad:#F08A72; --bad-soft:#3A1E18; --warn:#E8B04A; --warn-soft:#3A2E14; --idle:#A3A9B2; --idle-soft:#252B2F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E6EEE9; --muted:#93A59C; --line:#26352E;
  --accent:#4DB8A9; --accent-ink:#06201C; --soft:#173430;
  --ok:#5CC98A; --ok-soft:#173726; --bad:#F08A72; --bad-soft:#3A1E18; --warn:#E8B04A; --warn-soft:#3A2E14; --idle:#A3A9B2; --idle-soft:#252B2F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
body.lock{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.86rem;margin:0}
p{margin:0}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn svg{width:20px;height:20px}
.back{border:0;background:transparent;padding:6px 2px;font-weight:600;color:var(--accent)}
.ptitle{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ptitle>div{min-width:0}

/* Dosya fişi: alt kenarı tırtıklı */
.slip{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 0 0;padding:18px 18px 22px;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x;
          mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x}
.slip .label{color:inherit;opacity:.78}
.slip .big{font:600 2.2rem/1.1 var(--f-num);margin-top:2px}
.slip .big small{font:500 1rem var(--f-body);opacity:.85;margin-left:6px}
.slip .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--accent-ink) 40%,transparent)}
.slip .row div{min-width:0}
.slip .row .v{display:block;font:600 clamp(.82rem,3.6vw,1.1rem) var(--f-num);white-space:nowrap}
.slip .row .v.t{font:600 .98rem/1.3 var(--f-body)}
.slip .stage{font:700 1.35rem/1.25 var(--f-display);margin-top:4px;overflow-wrap:anywhere}
.slip .where{margin-top:6px;font-size:.95rem;display:flex;gap:6px;align-items:flex-start}
.slip .where svg{width:18px;height:18px;flex:none;margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select,.field textarea,.search,.sel{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-width:0}
.search,.sel{background:var(--surface)}
textarea{resize:vertical;min-height:72px}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.primary{border:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:9px;font-weight:600;font-size:1rem}
.ghost{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;font-weight:500}
.ghost.sm{padding:5px 10px;font-size:.86rem}
.danger{border:1px solid var(--bad);background:transparent;color:var(--bad);padding:8px 12px;border-radius:8px;font-weight:600}
.danger.armed{background:var(--bad);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow>.primary{flex:1}
.err{color:var(--bad);font-size:.86rem;margin:0;min-height:1em}

.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:.88rem}

.newbtn{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px 14px;text-align:left;width:100%;background:var(--surface);border:2px dashed var(--accent);border-radius:12px;padding:14px 16px;color:var(--ink)}
.newbtn svg{grid-row:span 2;width:32px;height:32px;color:var(--accent)}
.newbtn b{font-size:1.05rem}
.newbtn small{color:var(--muted);font-size:.84rem}

.alert{display:grid;gap:4px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:12px 14px;font-size:.9rem}
.alert button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px dashed color-mix(in srgb,var(--warn) 30%,transparent)}
.alert button:first-of-type{border-top:0}
.alert button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.alert button span:last-child{color:var(--warn);font-weight:600;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-num)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:7px;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.frow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}

/* Dosya kartları */
.flist{display:grid;gap:10px}
.fcard{display:grid;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;color:var(--ink)}
.fcard:hover{border-color:var(--accent)}
.fcard.late{border-left-color:var(--warn)}
.fcard.eksik{border-left-color:var(--warn)}
.fcard.tamam{border-left-color:var(--ok)}
.fcard.iptal{border-left-color:var(--idle)}
.fcard .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}
.fcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .no{font:500 .78rem var(--f-num);color:var(--muted)}
.fcard .sub{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.fcard .st b{font-weight:600}
.meter{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.fcard.tamam .meter i{background:var(--ok)}
.fcard .ft{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.when{font-size:.76rem;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg);white-space:nowrap}
.when.soon{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);font-weight:500;white-space:nowrap}
.tag.pub{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill{font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.eksik{background:var(--warn-soft);color:var(--warn)} .pill.tamam{background:var(--ok-soft);color:var(--ok)} .pill.iptal{background:var(--idle-soft);color:var(--idle)}
.empty{color:var(--muted);font-size:.92rem;text-align:center;padding:24px 12px;display:grid;gap:10px;justify-items:center}

/* Aşamalar */
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:5px 0;position:relative}
.steps li::before{content:"";position:absolute;left:12px;top:27px;bottom:-5px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--accent)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font:600 .7rem var(--f-num);color:var(--muted);position:relative;z-index:1}
.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.steps .n{padding-top:3px;font-size:.92rem;overflow-wrap:anywhere}
.cur .n{font-weight:600}
.steps .d{padding-top:4px;font-size:.78rem;color:var(--muted);font-family:var(--f-num)}

.tl{display:grid;gap:0}
.tl .e{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tl .e:last-child{border-bottom:0}
.tl .dt{font:500 .8rem var(--f-num);color:var(--muted);padding-top:2px}
.tl b{font-weight:600}
.tl .lc{font-size:.84rem;color:var(--muted)}

.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.doc .ic{width:42px;height:42px;border-radius:7px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font:600 .66rem var(--f-num);overflow:hidden}
.doc .ic img{width:100%;height:100%;object-fit:cover}
.doc b{display:block;font-weight:500;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small{color:var(--muted);font-size:.78rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .acts{display:flex;gap:4px}
.x{border:0;background:transparent;color:var(--muted);min-width:30px;height:30px;border-radius:6px;font-weight:600}
.x.armed{background:var(--bad);color:#fff;padding:0 8px;font-size:.78rem}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:4px}

.evr{display:grid;gap:2px}
.evr label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.evr label:last-child{border-bottom:0}
.evr input{width:20px;height:20px;accent-color:var(--accent)}
.evr .ok span{text-decoration:line-through;color:var(--muted)}
.miss{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.miss b{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.codebox{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.codebox .code{font:600 1.1rem var(--f-num);letter-spacing:.05em;user-select:all;overflow-wrap:anywhere}
.fmcard{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fmcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.fmcard b{font-weight:600;font-size:1.02rem}
.fmcard small{color:var(--muted);font-size:.84rem}
.stat{font-size:.82rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.syncbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:.88rem}
.syncbar small{color:var(--muted)}

/* Alt sayfalar */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;align-content:start}
.sheet .field input,.sheet .field select,.sheet .field textarea{background:var(--bg)}
.overlay.drawer{align-items:stretch;justify-content:flex-start;padding-top:0}
.dpanel{background:var(--surface);width:min(300px,84%);height:100%;overflow:auto;display:flex;flex-direction:column;gap:2px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.dhead{display:grid;gap:4px;padding:6px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.dhead b{font:700 1.2rem var(--f-display);overflow-wrap:anywhere}
.dhead small{color:var(--muted)}
.dsep{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 2px}
.dlink{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:10px;font-weight:600;font-size:1rem;color:var(--ink)}
.dlink svg{width:22px;height:22px;color:var(--accent);flex:none}
.dlink:hover,.dlink[aria-current="true"]{background:var(--bg)}
.dver{margin-top:auto;padding:14px 10px 0;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.dpanel{animation:dslide .18s ease-out}.sheet{animation:sup .18s ease-out}@keyframes dslide{from{transform:translateX(-100%)}}@keyframes sup{from{transform:translateY(24px);opacity:.7}}}

.welcome{display:grid;gap:14px;padding-top:8vh}
.choice{display:grid;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice b{font:700 1.1rem var(--f-display)}
.choice small{color:var(--muted);font-size:.9rem}

.viewer{position:fixed;inset:0;background:#000;z-index:30;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#fff;color:#000;border:0;border-radius:999px;padding:8px 14px;font-weight:600}
.busy{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:16px}
.busy div{background:var(--surface);border-radius:14px;padding:22px 26px;display:grid;gap:12px;justify-items:center;max-width:300px;text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:400px){.grid2{grid-template-columns:1fr}.slip .big{font-size:1.9rem}.seg button{font-size:.78rem}.tl .e{grid-template-columns:1fr;gap:0}}
@media (prefers-reduced-motion:reduce){.toast,.switch i,.switch i::after{transition:none}.spin{animation-duration:3s}}
</style>
</head><body>
<style>
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs2 button{border:0;background:transparent;padding:9px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.orgbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;max-width:34vw;min-width:0;flex:0 1 auto;font-size:.84rem}
header.top .hl{flex:1 1 auto}
header.top .hl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgbtn i{font-style:normal;color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.mrow small{color:var(--muted);font-size:.82rem}

var sb = null;

function role(){ return S.org ? S.org.role : null }

  }).then(function(m){
    S.mems = (m || []).filter(function(x){ return x.orgs }).sort(function(a, b){ return a.orgs.ad.localeCompare(b.orgs.ad, "tr") });

}
var chan = null;
function selectOrg(m){
  S.org = m; S.files = []; S.firms = []; S.folders = []; S.myShares = {}; S.notifs = []; S.members = []; S.invites = []; S.det = null; S.loaded = false;
  if(chan){ try{ sb.removeChannel(chan) }catch(e){} chan = null }
  if(!m){ render(); return Promise.resolve() }
  lsSet("izin-org", m.org_id);
  render();
  S.seen = +(lsGet("izin-gordum-" + m.org_id) || 0) || (Date.now() - 7*864e5);
  return Promise.all([loadFiles(), loadFirms(), loadFolders(), role() === "misafir" ? loadMyShares() : null, loadNotifs(), isStaff() ? loadLists() : null, isStaff() ? loadTeam() : null]).then(function(){

}
function loadFiles(){ return q(sb.from("files").select("*").eq("org_id", orgId()).order("updated_at", {ascending:false})).then(function(d){ S.files = d || [] }) }
function loadFirms(){ return q(sb.from("firms").select("*").eq("org_id", orgId()).order("ad")).then(function(d){ S.firms = d || [] }) }
function loadMyShares(){ return q(sb.from("file_shares").select("file_id, yetki").eq("user_id", S.user.id)).then(function(d){ S.myShares = {}; (d || []).forEach(function(x){ S.myShares[x.file_id] = x.yetki }) }) }
function loadNotifs(){ return q(sb.from("events").select("*").eq("org_id", orgId()).neq("user_id", S.user.id).gt("created_at", new Date(S.seen - 30*864e5).toISOString()).order("created_at", {ascending:false}).limit(40)).then(function(d){ S.notifs = d || [] })["catch"](function(){ S.notifs = [] }) }
function unread(){ return S.notifs.filter(function(e){ return new Date(e.created_at).getTime() > S.seen }).length }
function canWrite(f){ if(isStaff() || role() === "firma") return true; return S.myShares[f.id] === "islem" }
function evText(e){ var f = byId(S.files, e.file_id), a = f && e.asama != null ? (f.asamalar || [])[e.asama] : "";
  return e.tip === "iade" ? "İade: " + (e.notu || "") : e.tip === "asama" ? (a ? a + " aşamasına geçti" : "Aşama değişti") + (e.notu ? " · " + e.notu : "") : e.tip === "durum" ? "Durum: " + (DURUM[e.durum] || e.durum) : (e.notu || "Yeni kayıt") }

var refT = {};

  try{
    chan = sb.channel("org-" + orgId())
      .on("postgres_changes", {event:"*", schema:"public", table:"files", filter:"org_id=eq." + orgId()}, function(){ debounce("files", function(){ loadFiles().then(function(){ if(route.s === "file" && S.det){ var f = byId(S.files, route.id); if(f) S.det.file = f } render() }) }) })

      .on("postgres_changes", {event:"*", schema:"public", table:"events", filter:"org_id=eq." + orgId()}, function(p){ var fid = (p["new"] && p["new"].file_id) || (p.old && p.old.file_id); if(route.s === "file" && fid === route.id) debounce("det", function(){ loadDetail(route.id, true) }) })

function isLate(f){ var d = days(f.son_islem); return isActive(f) && d != null && d > esik() }

function firmName(id){ var x = id ? byId(S.firms, id) : null; return x ? x.ad : "" }
function folderOf(id){ return id ? byId(S.folders, id) : null }
function folderPath(id){ var out = [], f = folderOf(id), guard = 0; while(f && guard++ < 50){ out.unshift(f); f = folderOf(f.parent_id) } return out }
function pathText(f){ return folderPath(f.folder_id).map(function(x){ return x.ad }).join(" › ") }
function subFolders(firmId, parentId){ return S.folders.filter(function(x){ return x.firm_id === firmId && (x.parent_id || null) === (parentId || null) }).sort(function(a, b){ return a.ad.localeCompare(b.ad, "tr", {numeric:true}) }) }
function descIds(id){ var out = [id]; for(var i=0;i<out.length;i++) S.folders.forEach(function(x){ if(x.parent_id === out[i]) out.push(x.id) }); return out }
function folderStats(id){ var ids = descIds(id), fs = S.files.filter(function(f){ return f.folder_id && ids.indexOf(f.folder_id) >= 0 }); return {n:fs.length, act:fs.filter(isActive).length, late:fs.filter(isLate).length, sub:ids.length - 1} }

var pendingShare = null;
window.kasaShareDone = function(ok){ busy(false); var r = pendingShare; pendingShare = null; if(r) r(!!ok) };
function blobToB64(b){ return new Promise(function(res){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(",")[1] || "") }; r.onerror = function(){ res("") }; r.readAsDataURL(b) }) }
function shareFiles(files, mail){
  if(nat("addAttachment") && nat("shareAttachments")){
    busy(true, "Dosya hazırlanıyor…");
    try{ window.KasaNative.clearAttachments() }catch(e){}
    return files.reduce(function(p, f){ return p.then(function(){ return blobToB64(f.blob).then(function(b){ window.KasaNative.addAttachment(f.name, f.blob.type || "application/octet-stream", b) }) }) }, Promise.resolve())
      .then(function(){ return new Promise(function(res){ pendingShare = res; window.KasaNative.shareAttachments(mail.to || "", mail.subject || "", mail.body || "") }) });
  }
  try{ var fl = files.map(function(f){ return new File([f.blob], f.name, {type:f.blob.type || "application/octet-stream"}) }); if(navigator.canShare && navigator.canShare({files:fl}) && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return navigator.share({files:fl, title:mail.subject || ""}).then(function(){ return true }, function(){ return false }) }catch(e){}
  files.forEach(function(f){ var a = document.createElement("a"); a.href = URL.createObjectURL(f.blob); a.download = f.name; document.body.appendChild(a); a.click(); a.remove() });
  return Promise.resolve(true);
}
function shareText(txt){
  if(nat("shareText")){ window.KasaNative.shareText(txt); return }
  if(navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){ navigator.share({text:txt})["catch"](function(e){ if(!e || e.name !== "AbortError") showCopy(txt) }); return }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast("Mesaj kopyalandı; WhatsApp ya da e-postaya yapıştırın") }, function(){ showCopy(txt) }) }catch(e){ showCopy(txt) }
}

  }
  else if(id === "islemForm" && f){
    var ai = +v("iAsama"), tarih = v("iTarih") || today(), konum = v("iKonum").trim(), not = v("iNot").trim(), done = isStaff() && v("iDone"), pub = isStaff() ? v("iPub") : true;
    var changed = ai !== (f.aktif || 0), resent = f.durum === "iade" && v("iResent");
    if(!changed && !not && konum === (f.konum || "") && !done && !resent){ $("iErr").textContent = "Aşama, konum ya da açıklamadan birini değiştirin."; return }
    busy(true, "Kaydediliyor…");
    var ev = {tip:changed ? "asama" : "not", asama:changed ? ai : null, tarih:tarih, notu:not, konum:konum !== (f.konum || "") || changed ? konum : null, pub:pub};
    if(resent && !not) ev.notu = "Düzeltildi, kuruma tekrar gönderildi";
    addEvent(f.id, ev).then(function(){ return done ? addEvent(f.id, {tip:"durum", durum:"tamam", tarih:tarih, pub:pub}) : (resent && !changed ? addEvent(f.id, {tip:"durum", durum:"devam", tarih:tarih, pub:pub}) : null) })
      .then(function(){
        var wa = v("iWa"); busy(false); closeSheet(); toast("İşlem kaydedildi");
        if(wa && ev.pub){ var line = (done ? "Dosyanız tamamlandı." : changed ? "Dosyanız “" + f.asamalar[ai] + "” aşamasına geçti." : resent ? "Dosyanız düzeltilerek kuruma tekrar gönderildi." : "Dosyanızda yeni bir işlem var.") + (konum ? "\nŞu an: " + konum : "") + (not ? "\nNot: " + not : ""); notifyCustomer(f, line) }
        return refreshFileAfter(f.id) })["catch"](function(err){ busy(false); $("iErr").textContent = errMsg(err) });
  }
  else if(id === "iadeForm" && f){
    var neden = v("rNeden").trim(), kur = v("rKurum").trim();
    if(!neden){ $("rErr").textContent = "İade nedenini yazın."; return }
    var ra = v("rAsama");
    busy(true, "Kaydediliyor…");
    addEvent(f.id, {tip:"iade", asama:ra === "" ? null : +ra, tarih:v("rTarih") || today(), notu:(kur ? kur + " iade etti: " : "İade nedeni: ") + neden, konum:v("rKonum").trim() || null, pub:isStaff() ? v("rPub") : true})
      .then(function(){ var wa = v("rWa"), pub = isStaff() ? v("rPub") : true; busy(false); closeSheet(); toast("İade kaydedildi");
        if(wa && pub) notifyCustomer(f, "Dosyanız " + (kur || "kurum") + " tarafından iade edildi.\nNeden: " + neden + "\nDüzeltip en kısa sürede tekrar göndereceğiz.");
        return refreshFileAfter(f.id) })["catch"](function(err){ busy(false); $("rErr").textContent = errMsg(err) });
  }
  else if(id === "evForm" && f){ var en = v("evNew").trim(); if(!en) return; var ev2 = (f.evrak || []).concat([{ad:en, ok:false}]); q(sb.from("files").update({evrak:ev2}).eq("id", f.id)).then(function(){ return refreshFileAfter(f.id) }).then(function(){ var el = $("evNew"); if(el) el.focus() })["catch"](function(err){ toast(errMsg(err)) }) }
  else if(id === "docForm" && f){
    var fs = ui.pendingDocs || [], meta = {tur:v("dTur"), tarih:v("dTarih") || today(), notu:v("dNot").trim(), pub:isStaff() ? v("dPub") : true};
    closeSheet(); var done2 = 0, failed = [];
    fs.reduce(function(p, file){ return p.then(function(){
      busy(true, "Yükleniyor " + (done2 + 1) + "/" + fs.length + ": " + file.name);
      var path = orgId() + "/" + f.id + "/" + uuid() + "-" + safeName(file.name);
      return sb.storage.from("belgeler").upload(path, file, {contentType:file.type || "application/octet-stream", upsert:false}).then(function(r){
        if(r.error) throw r.error;
        return q(sb.from("docs").insert({file_id:f.id, path:path, ad:file.name, tip:file.type || "", boyut:file.size, tur:meta.tur, tarih:meta.tarih, notu:meta.notu, pub:meta.pub}));
      }).then(function(){ done2++ }, function(err){ failed.push(file.name + " (" + errMsg(err) + ")") });
    }) }, Promise.resolve()).then(function(){
      busy(false); ui.pendingDocs = null;
      if(done2) addEvent(f.id, {tip:"belge", tarih:meta.tarih, notu:done2 + " belge eklendi: " + meta.tur + (meta.notu ? " · " + meta.notu : ""), pub:meta.pub})["catch"](function(){});
      toast(failed.length ? "Yüklenemedi: " + failed.join(", ") : done2 + " belge eklendi");
      return loadDetail(f.id, true);
    });
  }
  else if(id === "ocForm"){
    q(sb.rpc("create_org_code", {p_not:v("ocNot").trim()})).then(function(code){ toast("Kod üretildi: " + code); return loadOrgCodes() }).then(render)["catch"](function(err){ toast(errMsg(err)) });
  }
  else if(id === "shareForm" && f){
    var yt = v("shY"); busy(true, "Kod oluşturuluyor…");
    q(sb.rpc("create_invite", {p_org:orgId(), p_role:"misafir", p_firm:null, p_file:f.id, p_yetki:yt})).then(function(code){ busy(false); closeSheet(); shareText(inviteText(code, "misafir", f.ad, yt)); return loadTeam() }).then(render)["catch"](function(err){ busy(false); toast(errMsg(err)) });
  }
  else if(id === "folderForm"){
    var foad = v("foAd").trim(); if(!foad) return;
    var pr2 = ui.folderEdit ? q(sb.from("folders").update({ad:foad}).eq("id", ui.folderEdit)) : q(sb.from("folders").insert({org_id:orgId(), firm_id:route.id, parent_id:route.folder || null, ad:foad}).select().single());
    pr2.then(function(r){ closeSheet(); return loadFolders().then(function(){ return r }) }).then(function(r){
      toast(ui.folderEdit ? "Kaydedildi" : "Klasör açıldı");
      if(!ui.folderEdit && r && r.id) go("cust", {id:route.id, folder:r.id}); else render();
    })["catch"](function(err){ toast(errMsg(err)) });
  }
  else if(id === "firmForm"){
    var fad = v("fAd").trim(); if(!fad) return;
    var body = {ad:fad, yetkili:v("fYet").trim(), tel:v("fTel").trim(), eposta:v("fEp").trim()};
    var pr = ui.firmEdit ? q(sb.from("firms").update(body).eq("id", ui.firmEdit)) : q(sb.from("firms").insert(Object.assign({org_id:orgId()}, body)));
    pr.then(function(){ closeSheet(); return loadFirms() }).then(function(){ render(); toast(ui.firmEdit ? "Kaydedildi" : "Müşteri eklendi. Girip klasör açabilirsiniz.") })["catch"](function(err){ toast(errMsg(err)) });
  }
  else if(id === "listsForm"){
    var ups = S.lists.map(function(l, i){ return {id:l.id, user_id:l.user_id, ad:v("lAd" + i).trim() || l.ad, asamalar:v("lAs" + i).split("\n").map(function(s){ return s.trim() }).filter(Boolean), sira:i, updated_at:new Date().toISOString()} }).filter(function(l){ return l.asamalar.length });
    q(sb.from("stage_lists").upsert(ups)).then(loadLists).then(function(){ render(); toast("Listeler kaydedildi") })["catch"](function(err){ toast(errMsg(err)) });
  }
  else if(id === "profForm"){ var pad = v("pAd").trim(); q(sb.from("profiles").upsert({id:S.user.id, ad:pad})).then(function(){ S.profile.ad = pad; render(); toast("Kaydedildi") })["catch"](function(err){ toast(errMsg(err)) }) }
  else if(id === "orgSetForm"){
    var oad2 = v("oAd").trim(), es = Math.max(1, parseInt(v("oEsik"), 10) || 20); if(!oad2) return;
    var ik = v("oIs").split("\n").map(function(x){ return x.trim() }).filter(Boolean);
    q(sb.from("orgs").update({ad:oad2, esik:es, is_kollari:ik}).eq("id", orgId())).then(function(){ S.org.orgs.ad = oad2; S.org.orgs.esik = es; S.org.orgs.is_kollari = ik; render(); toast("Kaydedildi") })["catch"](function(err){ toast(errMsg(err)) });
  }
});

/* Telefonun geri tuşu */
window.kasaBack = function(){
  if(!$("busy").hidden) return true;
  if(!$("viewer").hidden){ $("viewer").hidden = true; return true }
  if($("ovl").innerHTML){ closeSheet(); return true }
  if(route.s === "file" && route.from === "cust"){ var bk = route.back || {}; if(bk.s === "cust") go("cust", {id:bk.id, folder:bk.folder || null}); else go("home", {folder:bk.folder || null}); return true }
  if(route.s === "cust" && route.folder){ var cf = folderOf(route.folder); go("cust", {id:route.id, folder:cf ? cf.parent_id || null : null}); return true }
  if(route.s === "cust"){ go("firms"); return true }
  if(route.s === "home" && route.folder){ var hf = folderOf(route.folder); go("home", {folder:hf ? hf.parent_id || null : null}); return true }
  if(S.org && route.s !== "home"){ go("home"); return true }
  return false;
};
document.addEventListener("keydown", function(e){ if(e.key === "Escape") window.kasaBack() });

/* ================= Kurulabilir uygulama ================= */
var installEvt = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); installEvt = e });
if("serviceWorker" in navigator && location.protocol === "https:"){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").then(function(reg){ reg.update() })["catch"](function(){}) }) }

/* ================= Başlat ================= */
if(initClient()){
  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(s){ S.user = s.user; return loadMe() }
    render();
  })["catch"](function(){ render() });
  sb.auth.onAuthStateChange(function(ev, session){
    if(ev === "SIGNED_IN" && session && (!S.user || S.user.id !== session.user.id)){ S.user = session.user; loadMe() }
    if(ev === "SIGNED_OUT"){ S.user = null; S.mems = []; S.org = null; render() }
  });
} else render();
})();
</script>
